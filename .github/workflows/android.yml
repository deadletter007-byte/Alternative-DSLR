
name: Alternative DSLR Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alternative-DSLR-camera-repair-pass1.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Alternative-DSLR-camera-repair-pass1.zip"
          test -f "$ZIP"
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          mapfile -t PROJECT_FILES < <(
            find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \)
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one Gradle project root"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "${PROJECT_FILES[0]}")"
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alternative-DSLR-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
