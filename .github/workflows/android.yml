name: Alternative DSLR Camera Fix Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alternative-DSLR-camera-capture-fix.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract updated source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Alternative-DSLR-camera-capture-fix.zip"

          test -f "$ZIP"
          unzip -t "$ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

          cp -a extracted/. "$GITHUB_WORKSPACE"/

          test -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.sha256

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            dump badging "$APK" | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alternative-DSLR-Camera-Fix-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
