name: Alternative DSLR Update23 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alternative-DSLR-Update23-Validation-Candidate-v2.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Unit Test and Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Verify and extract Update23 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Alternative-DSLR-Update23-Validation-Candidate-v2.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts
          cp -a extracted/. "$GITHUB_WORKSPACE"/

      - name: Apply Kotlin import correction
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/example/MainViewModel.kt"
          if ! grep -q '^import kotlinx.coroutines.withContext$' "$FILE"; then
            sed -i '/^import kotlinx.coroutines.launch$/a import kotlinx.coroutines.withContext' "$FILE"
          fi
          grep -n '^import kotlinx.coroutines.withContext$' "$FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK/cmdline-tools"
          test -d "$SDK/platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.sha256
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Upload APK and Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alternative-DSLR-Update23-Validation-Results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app-debug.sha256
          if-no-files-found: warn
          retention-days: 14
